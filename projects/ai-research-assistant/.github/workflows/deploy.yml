name: Research Assistant CD (Production Deployment)

"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target Deployment Environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      skip_smoke_tests:
        description: "Skip automated post-deployment smoke tests"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  deployments: write

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Stage 1: Quality Gate & Pre-Deployment Verification
  # ============================================================================
  pre-deploy-validation:
    name: Pre-Deployment Validation & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ai-research-assistant
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/ai-research-assistant/requirements.txt

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest ruff

      - name: Code Quality & Linting
        run: ruff check backend tests

      - name: Run Test Suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./deploy_test.db
          JWT_SECRET_KEY: test-predeploy-secret-key-min-32-chars
          LLM_API_KEY: test-predeploy-llm-key
        run: |
          alembic upgrade head
          pytest -q tests/
          rm -f deploy_test.db

  # ============================================================================
  # Stage 2: Container Image Build, Security Scan & Publishing
  # ============================================================================
  build-and-publish:
    name: Build & Publish Container Images
    needs: pre-deploy-validation
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata & Tags
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME:-latest}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: projects/ai-research-assistant
          file: projects/ai-research-assistant/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: projects/ai-research-assistant/frontend
          file: projects/ai-research-assistant/frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.PROD_API_BASE_URL || 'https://api.research.example.com' }}
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 3: Controlled Database Migration
  # ============================================================================
  migrate-database:
    name: Apply Database Migrations (Controlled)
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Database Migrations (Alembic)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          cd projects/ai-research-assistant
          pip install --upgrade pip
          pip install -r requirements.txt
          echo "Executing Alembic database migrations..."
          alembic upgrade head
          echo "Migrations completed successfully."

  # ============================================================================
  # Stage 4: Versioned Rollout
  # ============================================================================
  deploy-services:
    name: Deploy Application & Worker Containers
    needs: [build-and-publish, migrate-database]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Rolling Deployment
        run: |
          echo "Triggering zero-downtime rolling update for backend, worker, and frontend..."
          echo "Deploying image tag: ${{ needs.build-and-publish.outputs.image_tag }}"
          # Production deployment hook (e.g. AWS ECS update-service, kubectl set image, or webhook)

  # ============================================================================
  # Stage 5: Health & Post-Deployment Smoke Tests
  # ============================================================================
  smoke-test-verification:
    name: Health Check & Post-Deployment Smoke Tests
    needs: deploy-services
    if: ${{ !inputs.skip_smoke_tests }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ai-research-assistant
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Deployment Smoke Tests
        env:
          BASE_URL: ${{ secrets.PROD_API_BASE_URL || 'https://api.research.example.com' }}
          SMOKE_TEST_USER: ${{ secrets.SMOKE_TEST_USER || 'smoke_tester@example.com' }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD || 'SmokePass123!' }}
        run: |
          python -m pip install requests
          python scripts/smoke_test_deployment.py

  # ============================================================================
  # Stage 6: Automated Rollback on Failure
  # ============================================================================
  automated-rollback:
    name: Rollback on Deployment Failure
    needs: smoke-test-verification
    if: failure()
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Initiate Automated Rollback
        run: |
          echo "CRITICAL: Health checks or smoke tests failed post-deployment!"
          echo "Initiating automated rollback to previous known-good release candidate..."
          # Invoke rollback webhook / script
