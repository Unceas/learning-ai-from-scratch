apiVersion: v1
kind: Secret
metadata:
  name: research-secrets
  namespace: research-assistant
  labels:
    app.kubernetes.io/name: ai-research-assistant
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database Connection String with Credentials
  DATABASE_URL: "postgresql+psycopg2://research_user:replace_with_secure_db_pass@postgres.research-assistant.svc.cluster.local:5432/research_db"

  # Redis Broker & Cache Connection String
  REDIS_URL: "redis://:replace_with_redis_pass@redis.research-assistant.svc.cluster.local:6379/0"

  # High-Entropy JWT Signing Key (Minimum 32 bytes)
  JWT_SECRET_KEY: "replace-with-a-very-secure-32-byte-hex-encoded-secret-key"

  # External LLM Provider API Key
  LLM_API_KEY: "replace-with-production-llm-provider-api-key"

  # S3 Object Storage Credentials
  S3_ACCESS_KEY: "replace-with-s3-access-key-id"
  S3_SECRET_KEY: "replace-with-s3-secret-access-key"
