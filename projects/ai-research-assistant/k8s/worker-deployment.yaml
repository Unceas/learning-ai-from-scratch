apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-worker
  namespace: research-assistant
  labels:
    app.kubernetes.io/name: ai-research-assistant
    app.kubernetes.io/component: worker
    app: document-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: document-worker
  template:
    metadata:
      labels:
        app: document-worker
        app.kubernetes.io/name: ai-research-assistant
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: research-api:1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - backend.worker
          envFrom:
            - configMapRef:
                name: research-config
            - secretRef:
                name: research-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
