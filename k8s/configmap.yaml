apiVersion: v1
kind: ConfigMap
metadata:
  name: research-config
  namespace: research-assistant
  labels:
    app.kubernetes.io/name: ai-research-assistant
    app.kubernetes.io/component: configuration
data:
  ENVIRONMENT: "production"
  APP_ENV: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  APP_NAME: "AI Research Assistant"
  APP_VERSION: "1.0.0"

  # Database Connection Pool Settings
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"
  DB_POOL_TIMEOUT: "30.0"
  DB_POOL_PRE_PING: "true"

  # Storage Configuration (S3 / MinIO)
  STORAGE_TYPE: "s3"
  STORAGE_PATH: "/app/uploads"
  S3_ENDPOINT_URL: "http://minio.research-assistant.svc.cluster.local:9000"
  S3_BUCKET_NAME: "ai-research-documents"
  S3_REGION: "us-east-1"
  MAX_UPLOAD_SIZE_MB: "25"

  # Vector Database Configuration (ChromaDB Server)
  CHROMA_SERVER_HOST: "chroma.research-assistant.svc.cluster.local"
  CHROMA_SERVER_PORT: "8000"
  CHROMA_SERVER_SSL: "false"

  # Distributed Queue & Caching Configuration (Redis)
  USE_DISTRIBUTED_QUEUE: "true"
  DISTRIBUTED_QUEUE_NAME: "document-indexing"
  DISTRIBUTED_CACHE_ENABLED: "true"
  DISTRIBUTED_CACHE_TTL: "3600"

  # AI Model & Pipeline Settings
  EMBEDDING_MODEL: "all-MiniLM-L6-v2"
  EMBEDDING_BATCH_SIZE: "64"
  RERANKER_MODEL: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  LLM_MODEL: "gemini-2.5-flash"
  LLM_TIMEOUT_SECONDS: "45.0"
  MAX_LLM_CONCURRENCY: "16"

  # Security & CORS
  CORS_ORIGINS: '["https://app.example.com"]'
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "30"
