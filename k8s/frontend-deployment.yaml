apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-frontend
  namespace: research-assistant
  labels:
    app.kubernetes.io/name: ai-research-assistant
    app.kubernetes.io/component: frontend
    app: research-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: research-frontend
  template:
    metadata:
      labels:
        app: research-frontend
        app.kubernetes.io/name: ai-research-assistant
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: research-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
